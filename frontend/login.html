<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de usuarios</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="imgs/icono.jpg" type="image/x-icon">
</head>
<body>
    <div class="caja-contenido">
        <form id="formularioLogin" class="formulario" action="" method="POST">
            <h1>Login</h1>
            <a class="enlace-cuentas" href="registro.html">No tengo cuenta</a>
            
            <label for="alias">Escribe tu alias de usuario</label>
            <input type="text" placeholder="Juan Pérez" id="alias" name="alias">
    
            <label for="clave">Escribe tu contraseña</label>
            <input type="password" placeholder="********" id="clave" name="clave">
    
            <input type="submit" class="boton" value="Login">
        </form>
    </div>
    

    <script src="js/login.js"></script>
</body>
</html>
