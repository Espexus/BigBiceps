<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de usuarios</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <form id="formularioLogin" class="formulario" action="" method="POST">
        <h1>Login</h1>
        <label for="alias">Escribe tu alias de usuario</label>
        <input type="text" placeholder="Juan Pérez" id="alias" name="alias">

        <label for="clave">Escribe tu contraseña</label>
        <input type="password" placeholder="********" id="clave" name="clave">

        <input type="submit" value="Login">
    </form>
    

    <script src=""></script>
</body>
</html>
